<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify a certificate — NATDS</title>
<meta name="description" content="Verify a NATDS certificate of completion. Enter the certificate ID printed at the bottom of the certificate to confirm it is genuine.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://natds.safalai.com.np/verify/">
<meta property="og:title" content="Verify a certificate — NATDS">
<meta property="og:description" content="Confirm a NATDS certificate of completion by its ID.">
<meta property="og:url" content="https://natds.safalai.com.np/verify/">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.png">
<style>
:root{
  --snow:#F4F5F2;--surface:#FFFFFF;--ink:#0E1A2B;--ink-2:#45505F;--ink-3:#7A8391;
  --line:#D3D9D6;--crimson:#C0192C;--crimson-deep:#9A1122;
  --green:#146B3A;--green-bg:#E7F3EC;--red:#9A1122;--red-bg:#FBEAEC;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--snow);color:var(--ink);
  font-family:Archivo,Arial,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;
}
a{color:var(--crimson)}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 20px}
header{padding:28px 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:38px;height:38px}
.brand span{font-weight:800;font-size:17px;letter-spacing:.16em}
main{flex:1;padding:24px 0 56px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em;margin:18px 0 8px;line-height:1.1}
.lede{color:var(--ink-2);margin:0 0 26px;max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px 22px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{
  flex:1;min-width:220px;font:inherit;font-weight:600;letter-spacing:.04em;
  padding:13px 14px;border:1px solid var(--line);border-radius:3px;background:#fff;
  color:var(--ink);text-transform:uppercase;
}
input:focus{outline:2px solid var(--crimson);outline-offset:1px;border-color:var(--crimson)}
input::placeholder{color:#A6ADB6;text-transform:none;font-weight:500;letter-spacing:0}
.btn{
  font:inherit;font-weight:700;font-size:.95rem;border:0;border-radius:3px;
  background:var(--crimson);color:#fff;padding:13px 26px;cursor:pointer;
}
.btn:hover{background:var(--crimson-deep)}
.btn:disabled{opacity:.6;cursor:default}
.hint{font-size:.85rem;color:var(--ink-3);margin-top:12px}
#result{margin-top:20px}
.result-card{border-radius:4px;padding:20px 20px 18px;border:1px solid var(--line);background:var(--surface)}
.result-card.ok{background:var(--green-bg);border-color:#BFDCCB}
.result-card.bad{background:var(--red-bg);border-color:#EFCBD0}
.result-card.neutral{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.ok .badge{color:var(--green)}
.bad .badge{color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.result-card h2{font-size:1.5rem;font-weight:800;margin:12px 0 2px;line-height:1.2}
.result-card .prog{font-weight:600;color:var(--ink-2);margin:2px 0}
.result-card .issued{font-size:.92rem;color:var(--ink-3);margin:6px 0 0}
.msg{font-size:1rem;color:var(--ink-2);margin:10px 0 0}
.actions{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.actions a{font-weight:700;font-size:.92rem;text-decoration:none;border-bottom:2px solid var(--crimson);padding-bottom:1px}
.meta-id{font-weight:700;letter-spacing:.05em;font-size:.9rem;color:var(--ink-3);margin-top:14px;word-break:break-all}
footer{border-top:1px solid var(--line);padding:20px 0 34px;font-size:.85rem;color:var(--ink-3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">
      <img src="/brand/emblem.webp" alt="">
      <span>NATDS</span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Verify a certificate</h1>
    <p class="lede">Enter the certificate ID printed at the bottom of a NATDS certificate to confirm that it is genuine.</p>

    <div class="card">
      <form id="form" autocomplete="off">
        <label for="id">Certificate ID</label>
        <div class="row">
          <input id="id" name="id" placeholder="NATDS-AIM-26B1-0001-W" spellcheck="false" autocapitalize="characters" enterkeyhint="go">
          <button class="btn" id="go" type="submit">Verify</button>
        </div>
        <p class="hint">The ID looks like <strong>NATDS-AIM-26B1-0001-W</strong> and is printed under the date on the certificate.</p>
      </form>
      <div id="result" role="status" aria-live="polite"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Nepal AI &amp; Tech Digital Solution</span>
    <span>Questions? <a href="https://wa.me/9779818488715" target="_blank" rel="noopener noreferrer">Message us on WhatsApp</a></span>
  </div>
</footer>

<script src="/verify/key.js"></script>
<script src="/verify/records-lib.js"></script>
<script>
(function () {
  var V = window.NatdsVerify;
  var form = document.getElementById("form");
  var input = document.getElementById("id");
  var button = document.getElementById("go");
  var out = document.getElementById("result");
  var cache = null;

  function store() {
    try { return window.localStorage; } catch (e) { return null; }
  }

  function loadAttempts() {
    var s = store();
    if (!s) return {attempts: []};
    try {
      var raw = s.getItem("natds-verify-attempts");
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && parsed.attempts) ? parsed : {attempts: []};
    } catch (e) { return {attempts: []}; }
  }

  function saveAttempts(state) {
    var s = store();
    if (!s) return;
    try { s.setItem("natds-verify-attempts", JSON.stringify(state)); } catch (e) {}
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }

  function show(html) { out.innerHTML = html; }

  function notFound(id) {
    show(
      '<div class="result-card bad">' +
        '<span class="badge"><span class="dot"></span>No record found</span>' +
        '<p class="msg">No record found. Check the ID or contact NATDS.</p>' +
        '<p class="meta-id">' + esc(id) + "</p>" +
      "</div>"
    );
  }

  function denied() {
    show(
      '<div class="result-card neutral">' +
        '<span class="badge">Too many attempts</span>' +
        '<p class="msg">Too many attempts from this device. Please try again in a few minutes, or contact NATDS directly.</p>' +
      "</div>"
    );
  }

  function render(rec, id) {
    if (rec.revoked) {
      show(
        '<div class="result-card bad">' +
          '<span class="badge"><span class="dot"></span>Revoked</span>' +
          '<p class="msg">This certificate has been revoked by NATDS and is no longer valid.</p>' +
          '<p class="meta-id">' + esc(id) + "</p>" +
        "</div>"
      );
      return;
    }
    show(
      '<div class="result-card ok">' +
        '<span class="badge"><span class="dot"></span>Valid certificate</span>' +
        "<h2>" + esc(rec.name) + "</h2>" +
        '<p class="prog">' + esc(rec.programme) + "</p>" +
        '<p class="issued">Issued ' + esc(V.formatDate(rec.date)) + "</p>" +
        '<div class="actions">' +
          '<a href="/certificate/?id=' + encodeURIComponent(id) + '">View certificate</a>' +
        "</div>" +
        '<p class="meta-id">' + esc(rec.id) + "</p>" +
      "</div>"
    );
  }

  function verify(rawId) {
    var id = V.normalizeId(rawId);
    if (!id) return;

    var gate = V.rateGate(loadAttempts(), Date.now());
    saveAttempts({attempts: gate.attempts});
    if (!gate.allowed) { denied(); return; }

    if (!V.isValidFormat(id)) { notFound(id); return; }

    button.disabled = true;
    show('<div class="result-card neutral"><p class="msg">Checking…</p></div>');

    var ready = cache
      ? Promise.resolve(cache)
      : fetch("/verify/records.dat")
          .then(function (r) {
            if (!r.ok) throw new Error("fetch failed");
            return r.json();
          })
          .then(function (dat) {
            return V.decryptRecords(dat, window.NATDS_VERIFY_KEY);
          })
          .then(function (data) {
            cache = data.records;
            return cache;
          });

    ready
      .then(function (records) {
        var rec = V.lookup(records, id);
        button.disabled = false;
        if (!rec) { notFound(id); return; }
        render(rec, rec.id);
      })
      .catch(function () {
        button.disabled = false;
        show(
          '<div class="result-card neutral">' +
            '<span class="badge">Connection problem</span>' +
            '<p class="msg">Could not reach the verification service. Check your connection and try again.</p>' +
          "</div>"
        );
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    verify(input.value);
  });

  var params = new URLSearchParams(window.location.search);
  var initial = params.get("id") || "";
  if (initial) {
    input.value = V.normalizeId(initial);
    verify(initial);
  } else {
    var q = params.get("q");
    if (q) input.value = V.normalizeId(q);
    input.focus();
  }
})();
</script>
</body>
</html>
